name: GigSathi Native Release APK Build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gigsathi-release-apk-auto.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate release signing key
        working-directory: android
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore release-keystore.jks -alias appcreator -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname 'CN=GigSathi, O=Great India Technology, C=IN'
      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gigsathi-native-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload JKS for future releases
        uses: actions/upload-artifact@v4
        with:
          name: gigsathi-release-keystore-jks
          path: android/release-keystore.jks
          if-no-files-found: error
          retention-days: 90
