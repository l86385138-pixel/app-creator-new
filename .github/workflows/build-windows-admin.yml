name: Build Gigbiz Windows Admin Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows-admin.yml"

permissions:
  contents: read

jobs:
  build-windows-admin:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Windows installer EXE was not generated." }
          Write-Host "Built installer: $($installer.FullName)"

      - name: Upload Windows Admin installer
        uses: actions/upload-artifact@v4
        with:
          name: gigbiz-admin-windows-installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
