name: Build Gigbiz Release APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Gigbiz Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate temporary release signing key
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair             -v             -keystore release-keystore.jks             -alias appcreator             -keyalg RSA             -keysize 2048             -validity 10000             -storepass android             -keypass android             -dname "CN=Gigbiz, OU=Android, O=App Creator, L=Gaya, ST=Bihar, C=IN"

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB
        working-directory: android
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Validate APK
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Validate AAB
        run: test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gigbiz-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: gigbiz-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
