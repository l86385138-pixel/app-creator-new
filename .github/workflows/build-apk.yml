name: Build GigSathi Release APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build GigSathi Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Firebase app configuration
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '"package_name": "technology.greatindia.gigsathiapp"' android/app/google-services.json; then
            echo "::error::android/app/google-services.json must be downloaded from Firebase for Android package technology.greatindia.gigsathiapp."
            exit 1
          fi

      - name: Restore or generate release signing key
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            test -s release-keystore.jks
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD_SECRET"
            KEY_ALIAS="${ANDROID_KEY_ALIAS_SECRET:-appcreator}"
            KEY_PASS="${ANDROID_KEY_PASSWORD_SECRET:-$STORE_PASS}"
            echo "Using repository-provided signing key."
          else
            echo "::warning::No persistent keystore secret found. Creating a temporary signing key for this build. Keep this key if you want to update this exact signed app later."
            STORE_PASS="GigSathiTemp-2026-Only"
            KEY_PASS="$STORE_PASS"
            KEY_ALIAS="appcreator"
            keytool -genkeypair -noprompt -keystore release-keystore.jks -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Great India Technology, OU=GigSathi, O=Great India Technology, L=Gaya, ST=Bihar, C=IN"
          fi
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Validate APK
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Validate AAB
        run: test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gigsathi-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: gigsathi-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
