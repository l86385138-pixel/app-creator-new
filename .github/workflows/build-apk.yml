name: Build Release APK and AAB

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        default: "App Creator App"
      web_url:
        description: "Website URL"
        required: true
        default: "https://example.com"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        env:
          APP_NAME: ${{ inputs.app_name || 'App Creator App' }}
          WEB_URL: ${{ inputs.web_url || 'https://example.com' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app/src/main/java/com/appcreator/newapp
          mkdir -p android/app/src/main/res/values

          python3 - <<'PY'
          import os, json
          from pathlib import Path

          app_name = os.environ["APP_NAME"]
          web_url = os.environ["WEB_URL"]

          root = Path("android")
          (root / "settings.gradle").write_text("""pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AppCreator"
          include(":app")
          """, encoding="utf-8")

          (root / "build.gradle").write_text("""plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          """, encoding="utf-8")

          (root / "app/build.gradle").write_text("""plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.appcreator.newapp'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.appcreator.newapp'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          """, encoding="utf-8")

          (root / "app/src/main/res/values/strings.xml").write_text(
              '<resources><string name="app_name">' +
              app_name.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace('"', "&quot;").replace("'", "\\'") +
              '</string></resources>',
              encoding="utf-8"
          )

          (root / "app/src/main/res/values/styles.xml").write_text("""<resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#111111</item>
              </style>
          </resources>
          """, encoding="utf-8")

          (root / "app/src/main/AndroidManifest.xml").write_text("""<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """, encoding="utf-8")

          url_java = json.dumps(web_url)
          (root / "app/src/main/java/com/appcreator/newapp/MainActivity.java").write_text(
              """package com.appcreator.newapp;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl(""" + url_java + """);

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  WebView webView = (WebView) findViewById(android.R.id.content);
                  super.onBackPressed();
              }
          }
          """, encoding="utf-8")
          PY

      - name: Set up Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Validate Release APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Validate Release AAB
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
