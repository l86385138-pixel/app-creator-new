<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Creator</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#111}.wrap{max-width:720px;margin:auto;padding:28px 18px}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001}h1{margin-top:0}input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0 14px;border:1px solid #ddd;border-radius:10px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#111;color:white;font-size:16px;cursor:pointer}.status{margin-top:18px;padding:12px;border-radius:10px;background:#f1f3f5}small{color:#666}</style></head><body><div class="wrap"><div class="card"><h1>🚀 App Creator</h1><p>अपनी वेबसाइट को Android App में बदलें।</p><label>App Name</label><input id="name" placeholder="My App"><label>Website URL</label><input id="url" placeholder="https://example.com"><button id="publish">Publish App</button><div id="status" class="status">Ready</div><p><small>Fresh build system connected to the new backend.</small></p></div></div><script>const status=document.getElementById('status');document.getElementById('publish').onclick=async()=>{const name=document.getElementById('name').value.trim();const url=document.getElementById('url').value.trim();if(!name||!/^https?:\\/\\//i.test(url)){status.textContent='App Name और valid Website URL भरें।';return}status.textContent='Publishing…';try{const r=await fetch('https://nrbvfxwlyauzvrhxmatt.supabase.co/rest/v1/app_projects',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({name,web_url:url,status:'queued'})});if(!r.ok)throw new Error('Backend request failed');const p=await r.json();status.textContent='App project created. Build pipeline setup next.';console.log(p)}catch(e){status.textContent='Backend connection अभी पूरा configure नहीं हुआ है।'}};</script></body></html>
