<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gigbiz Admin Login</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5fa;font-family:Arial,sans-serif;color:#202331}#app{width:100%;padding:20px}.boot-login{max-width:420px;margin:auto;background:#fff;padding:30px;border:1px solid #ddd;border-radius:18px;box-shadow:0 12px 36px #15204412}.boot-logo{font-size:24px;font-weight:900;color:#6d3abe}.muted{color:#737783;font-size:13px}#boot-error{color:#b42318;white-space:pre-wrap}</style></head>
<body><div id="app"><div class="boot-login"><div class="boot-logo">GIGBIZ</div><h1>Admin Login</h1><p class="muted">Windows Admin App — Admin only</p><p class="muted">Loading secure login…</p><div id="boot-error"></div></div></div>
<script>window.addEventListener('error',function(e){var el=document.getElementById('boot-error');if(el)el.textContent='App startup error: '+(e.message||'Please reinstall the latest Admin app.');});window.addEventListener('unhandledrejection',function(e){var el=document.getElementById('boot-error');if(el)el.textContent='App startup error: '+(e.reason&&e.reason.message?e.reason.message:String(e.reason));});</script>
<script src="renderer.js"></script></body></html>
