<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gigbiz</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#17212b}.top{background:#fff;padding:18px 22px;font-weight:800;font-size:24px;color:#6d3abe;border-bottom:1px solid #ddd}.wrap{max-width:720px;margin:auto;background:#fff;min-height:100vh}.hero{margin:16px;border-radius:20px;background:#4d2088;color:#fff;padding:24px}.hero h1{margin:0 0 14px;font-size:27px}.stats{display:flex;gap:8px;margin-top:18px}.stat{flex:1;text-align:center;border-top:1px dashed #ddd;padding-top:12px}.tabs{display:flex;background:#fff;border-bottom:1px solid #ddd}.tabs div{flex:1;text-align:center;padding:17px 4px;font-weight:700}.content{padding:16px}.box{background:#f8f9fb;border:1px solid #e2e5ea;border-radius:12px;padding:16px;white-space:pre-line;line-height:1.5}.input{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border:1px solid #cfd5dc;border-radius:9px;font-size:16px}.check{background:#f2f2f2;padding:15px;border-radius:9px;margin:10px 0}.btn{border:0;border-radius:28px;padding:15px 24px;background:#7c3dcc;color:#fff;font-size:17px;font-weight:700;width:100%;cursor:pointer}.small{color:#777;font-size:13px}</style></head><body><div class="wrap"><div class="top">GIGBIZ</div><div id="page"></div></div><script>const p=new URLSearchParams(location.search),title=p.get('title')||'Gigbiz Project',pay=p.get('pay')||'0',desc=p.get('desc')||'Project details will be provided by Gigbiz.',applyUrl=p.get('applyUrl')||'',page=document.getElementById('page');const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function detail(){page.innerHTML='<div class="hero"><h1>'+esc(title)+'</h1><div class="stats"><div class="stat"><b>'+esc(pay)+'</b><br>TOTAL EARNING</div><div class="stat">00<br>TOTAL LEADS</div><div class="stat">00<br>TOTAL SALES</div></div></div><div class="tabs"><div>Details</div><div>Marketing</div><div>Training</div></div><div class="content"><div class="box"><b>Offers</b>\\n\\n'+esc(desc)+'\\n\\n<b>Whom to refer?</b>\\nEligible customers can submit their information below.\\n\\n<b>Training</b>\\nTraining details are managed by Gigbiz Admin.</div><br><button class="btn" onclick="formPage()">APPLY NOW / SHARE</button></div>'}function formPage(){page.innerHTML='<div class="content"><h2>Apply Now</h2><p class="small">Please enter the customer information.</p><input id="phone" class="input" placeholder="Mobile Number" inputmode="tel"><input id="name" class="input" placeholder="Full Name"><input id="pin" class="input" placeholder="Pincode"><div class="check"><input id="agree" type="checkbox"> I authorise Gigbiz to securely store and use my information for this offer and accept the privacy policy.</div><button class="btn" onclick="submitForm()">SUBMIT</button></div>'}function submitForm(){if(!phone.value.trim()||!name.value.trim()||!pin.value.trim()||!agree.checked){alert('Please complete all fields and accept the consent.');return}if(applyUrl){location.href=applyUrl}else{page.innerHTML='<div class="content"><h2>Submitted successfully</h2><p>Your information has been submitted.</p><button class="btn" onclick="detail()">BACK</button></div>'}}detail();</script></body></html>
