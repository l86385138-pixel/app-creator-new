<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gigbiz Product</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17212b;font-family:Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;background:#fff;min-height:100vh}.top{height:62px;padding:15px 24px;border-bottom:1px solid #ddd;font-weight:800;font-size:22px;color:#6d3abe;display:flex;align-items:center}.back{color:#6d3abe;margin-right:10px}
.main{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:20px}.card{background:#fff;border:1px solid #e1e4e8;border-radius:10px;overflow:hidden}
.banner{width:100%;height:250px;object-fit:cover;background:#6d3abe}.placeholder{height:250px;background:linear-gradient(135deg,#6d3abe,#8b4ed8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:800;padding:25px;text-align:center}
.form{padding:16px}.input{width:100%;padding:15px;margin:7px 0;border:1px solid #cfd5dc;border-radius:7px;font-size:16px}.consent{background:#f1f1f1;padding:14px;margin:10px 0;border-radius:6px;font-size:13px;line-height:1.5}.btn{width:100%;border:0;border-radius:5px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;background:#2d7cf0;color:#fff}.btn:disabled{opacity:.5}.details{padding:20px}.tabs{display:flex;border-bottom:1px solid #ddd}.tab{flex:1;text-align:center;padding:17px;font-weight:700}.tab.active{border-bottom:3px solid #17212b}.section{padding:18px 0;border-bottom:1px solid #e2e2e2}.section:last-child{border-bottom:0}.section h3{margin:0 0 14px}.line{margin:12px 0;font-size:16px;line-height:1.45}.price{font-size:20px;font-weight:800;color:#6d3abe}@media(max-width:800px){.main{grid-template-columns:1fr;padding:12px}.banner,.placeholder{height:230px}.top{padding:14px 16px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><span class="back">‹</span><span>Product Detail</span></div>
<div id="app"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyBOzjux1dt0VOSWwKmjdQIDjF-GS-8RTC8",
 authDomain:"gayan-ganga-app.firebaseapp.com",
 projectId:"gayan-ganga-app",
 storageBucket:"gayan-ganga-app.firebasestorage.app",
 messagingSenderId:"981161594143",
 appId:"1:981161594143:web:43adfda36df680165f342a"
};
const fbApp=initializeApp(firebaseConfig);
const db=getFirestore(fbApp);
const auth=getAuth(fbApp);
const anonymousReady=signInAnonymously(auth);

const p=new URLSearchParams(location.search);
const q=k=>p.get(k)||"";
const title=q("title")||"Gigbiz Product";
const pay=q("pay")||"0";
const desc=q("desc")||"Product details and customer benefits will be provided by Gigbiz.";
const applyUrl=q("applyUrl");
const image=q("image");
const leads=q("leads")||"0";
const sales=q("sales")||"0";
const workerId=q("workerId");
const workerName=q("workerName");
const gigId=q("gigId");
const app=document.getElementById("app");

const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function detail(){
 app.innerHTML='<div class="main"><div><div class="card">'+
 (image?'<img class="banner" src="'+esc(image)+'">':'<div class="placeholder">'+esc(title)+'</div>')+
 '</div><div class="card form" style="margin-top:14px"><h3>Customer Information</h3>'+
 '<input id="phone" class="input" placeholder="Mobile Number" inputmode="tel">'+
 '<input id="name" class="input" placeholder="Full Name">'+
 '<input id="pin" class="input" placeholder="Pincode">'+
 '<div class="consent"><input id="agree" type="checkbox"> I authorise Gigbiz to securely store and use my data for this product and accept the privacy policy.</div>'+
 '<button id="submit" class="btn">SUBMIT</button></div></div>'+
 '<div class="card"><div class="details"><div class="tabs"><div class="tab active">Benefits</div><div class="tab">Details</div></div>'+
 '<div class="section"><h3>Features &amp; Benefits</h3>'+
 '<div class="line">🎁 <b>Customer Benefits:</b></div>'+
 '<div class="line">📱 Fully digital product/service process</div>'+
 '<div class="line">🏦 Product benefits configured by Gigbiz Admin</div>'+
 '<div class="line">💰 <span class="price">Earn ₹'+esc(pay)+'</span> worker earning</div>'+
 '<div class="line">❌ No unnecessary information required beyond the customer form</div>'+
 '<div class="line">🎁 Customer offer/details can be configured by Admin</div>'+
 '<div class="line">💵 Fees &amp; Charges</div><div class="line">— '+esc(desc)+'</div></div>'+
 '<div class="section"><h3>Whom to refer?</h3><div class="line">Eligible customers and referral information can be configured by Admin.</div></div>'+
 '<div class="section"><h3>Training</h3><div class="line">Training information can be configured by Admin.</div></div>'+
 '</div></div></div>';
 document.getElementById("submit").addEventListener("click",submitForm);
}

async function submitForm(){
 const phone=document.getElementById("phone").value.trim();
 const name=document.getElementById("name").value.trim();
 const pin=document.getElementById("pin").value.trim();
 const agree=document.getElementById("agree").checked;
 if(!phone||!name||!pin||!agree){alert("Please complete all fields and accept the consent.");return}
 if(!workerId){alert("This share link is invalid. Please ask the worker for a fresh link.");return}
 const btn=document.getElementById("submit");btn.disabled=true;
 try{
   await anonymousReady;
   await addDoc(collection(db,"leads"),{
     workerId:workerId,
     workerName:workerName,
     gigId:gigId,
     gigTitle:title,
     customerName:name,
     phone:phone,
     pincode:pin,
     taskAmount:Number(pay)||0,
     status:"interview_pending",
     walletCredited:false,
     source:"customer_share",
     consent:true,
     createdAt:serverTimestamp()
   });
   app.innerHTML='<div class="details"><h2>Submitted successfully ✅</h2><p>Your information has been sent to Gigbiz. The worker and Admin will review your lead.</p></div>';
   if(applyUrl)setTimeout(()=>location.href=applyUrl,1200);
 }catch(e){
   btn.disabled=false;
   alert("Unable to submit lead: "+e.message);
 }
}
detail();
</script>
</body></html>
